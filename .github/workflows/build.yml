name: Build MyCam Pro

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXORA_SHA: dd9c281a3922219fb5c5db42a1d1769c5abd1ea9
  UPSTREAM: https://github.com/akashlenvo/Nexora.git

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get engine
        shell: bash
        run: |
          git clone --recurse-submodules "$UPSTREAM" engine
          cd engine
          git checkout "$NEXORA_SHA"
          git submodule update --init --recursive
      - name: Brand
        shell: python
        run: |
          from pathlib import Path
          p=Path("engine/android/app/src/main/res/values/strings.xml")
          s=p.read_text(encoding="utf-8")
          for a,b in [
            ("Nexora","MyCam Pro"),
            ("Your phone. Your camera. Connected.","Телефон. Ваша камера. Подключено."),
            ("Connect to Nexora Studio","Подключение к MyCam Pro"),
            ("Open the QR code on your computer and place it inside the frame.","Откройте QR-код на компьютере и наведите на него камеру."),
            ("USB is detected automatically · Wi-Fi uses QR or IP","USB определяется автоматически · Wi-Fi подключается по QR-коду или IP"),
            ("Connect by IP address","Подключиться по IP-адресу"),
            ("Computer IP:port (for example 192.168.1.5:6969)","IP компьютера:порт (например 192.168.1.5:6969)")
          ]: s=s.replace(a,b)
          p.write_text(s,encoding="utf-8")
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build APK
        working-directory: engine/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean testReleaseUnitTest assembleRelease
      - name: Verify APK
        shell: bash
        run: test -s engine/android/app/build/outputs/apk/release/app-release.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyCamPro-Android
          path: engine/android/app/build/outputs/apk/release/app-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get engine
        shell: pwsh
        run: |
          git clone --recurse-submodules $env:UPSTREAM engine
          Set-Location engine
          git checkout $env:NEXORA_SHA
          git submodule update --init --recursive
      - name: Brand
        shell: pwsh
        run: |
          $files=Get-ChildItem "engine\windows\src" -Recurse -File -Include *.cpp,*.h
          foreach($f in $files){
            $s=Get-Content $f.FullName -Raw -Encoding UTF8
            $s=$s.Replace("Nexora Studio","MyCam Pro Studio")
            $s=$s.Replace("NEXORA","MYCAM PRO")
            $s=$s.Replace("Your phone. Your camera. Connected.","Телефон. Ваша камера. Подключено.")
            $s=$s.Replace("No devices detected","Устройства не найдены")
            $s=$s.Replace("OFFLINE  |  Waiting for a device","ОФЛАЙН | Ожидание устройства")
            $s=$s.Replace("Show QR code","Показать QR-код")
            $s=$s.Replace("Connected devices","Подключённые устройства")
            $s=$s.Replace("Connection","Подключение")
            $s=$s.Replace("Devices","Устройства")
            $s=$s.Replace("SOURCE","ИСТОЧНИК")
            Set-Content $f.FullName $s -Encoding UTF8
          }
      - name: MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: vcpkg
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install --triplet x64-windows
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" integrate install
      - name: Build virtual camera
        shell: cmd
        run: |
          msbuild engine\windows\3rdparty\softcam\softcam.sln /m /t:softcam /p:Configuration=Release /p:Platform=x64
          msbuild engine\windows\3rdparty\softcam\examples\softcam_installer\softcam_installer.sln /m /p:Configuration=Release /p:Platform=x64
      - name: Build Studio
        shell: cmd
        run: msbuild engine\windows\Nexora.sln /m /p:Configuration=Release /p:Platform=x64
      - name: Package
        shell: pwsh
        run: |
          $dist="$PWD\dist"
          New-Item -ItemType Directory -Force $dist | Out-Null
          $exe=Get-ChildItem "engine\windows" -Recurse -Filter "Nexora.exe" | Where-Object {$_.FullName -match "\\x64\\Release\\"} | Select-Object -First 1
          if(!$exe){throw "Nexora.exe not found"}
          Copy-Item $exe.FullName "$dist\MyCamPro.exe" -Force
          $softcam=Get-ChildItem "engine\windows\3rdparty\softcam" -Recurse -Filter "softcam.dll" | Where-Object {$_.FullName -match "dist\\bin\\x64"} | Select-Object -First 1
          $installer=Get-ChildItem "engine\windows\3rdparty\softcam" -Recurse -Filter "softcam_installer.exe" | Where-Object {$_.FullName -match "x64\\Release"} | Select-Object -First 1
          if(!$softcam -or !$installer){throw "Virtual camera build missing"}
          Copy-Item $softcam.FullName "$dist\softcam.dll" -Force
          Copy-Item $installer.FullName "$dist\softcam_installer.exe" -Force
          @'
          @echo off
          set "ROOT=%~dp0"
          "%ROOT%softcam_installer.exe" register "%ROOT%softcam.dll"
          if errorlevel 1 exit /b 1
          start "" "%ROOT%MyCamPro.exe"
          '@ | Set-Content "$dist\install.bat" -Encoding ASCII
          @'
          @echo off
          "%~dp0softcam_installer.exe" unregister "%~dp0softcam.dll"
          '@ | Set-Content "$dist\uninstall.bat" -Encoding ASCII
          @'
          MyCam Pro
          В OBS выбирайте: Устройство захвата видео -> MyCam Pro Camera.
          Подключение: Wi-Fi 2,4/5 ГГц или USB.
          '@ | Set-Content "$dist\README_RU.txt" -Encoding UTF8
      - name: Verify EXE
        shell: pwsh
        run: |
          if(!(Test-Path "dist\MyCamPro.exe")){throw "MyCamPro.exe not produced"}
          if((Get-Item "dist\MyCamPro.exe").Length -lt 100KB){throw "EXE is unexpectedly small"}
      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: MyCamPro-Windows-x64
          path: dist\**
          if-no-files-found: error
