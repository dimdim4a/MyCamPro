name: Build MyCam Pro
# Premium UI build: approved MyCam Pro reference layout

on:
  push:
    branches: [main, prototype/p0-core, fix/real-mycamp-ui-runtime]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXORA_SHA: dd9c281a3922219fb5c5db42a1d1769c5abd1ea9
  UPSTREAM: https://github.com/akashlenvo/Nexora.git

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get engine
        shell: bash
        run: |
          git clone --recurse-submodules "$UPSTREAM" engine
          cd engine
          git checkout "$NEXORA_SHA"
          git submodule update --init --recursive
      - name: Apply MyCam Pro Android connection patch
        shell: bash
        run: |
          cp "$PWD/patches/android/MainActivity.kt" engine/android/app/src/main/java/com/godoy/nexora/MainActivity.kt
      - name: Brand
        shell: python
        run: |
          from pathlib import Path
          p=Path("engine/android/app/src/main/res/values/strings.xml")
          s=p.read_text(encoding="utf-8")
          for a,b in [
            ("Nexora","MyCam Pro"),
            ("Your phone. Your camera. Connected.","Телефон. Ваша камера. Подключено."),
            ("Connect to Nexora Studio","Подключение к MyCam Pro"),
            ("Open the QR code on your computer and place it inside the frame.","Откройте QR-код на компьютере и наведите на него камеру."),
            ("USB is detected automatically · Wi-Fi uses QR or IP","USB определяется автоматически · Wi-Fi подключается по QR-коду или IP"),
            ("Connect by IP address","Подключиться по IP-адресу"),
            ("Computer IP:port (for example 192.168.1.5:6969)","IP компьютера:порт (например 192.168.1.5:6969)")
          ]: s=s.replace(a,b)
          p.write_text(s,encoding="utf-8")
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build APK
        working-directory: engine/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean testReleaseUnitTest assembleRelease
      - name: Verify APK
        shell: bash
        run: test -s engine/android/app/build/outputs/apk/release/app-release.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyCamPro-Android
          path: engine/android/app/build/outputs/apk/release/app-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get engine
        shell: pwsh
        run: |
          git clone --recurse-submodules $env:UPSTREAM engine
          Set-Location engine
          git checkout $env:NEXORA_SHA
          git submodule update --init --recursive
      - name: Apply MyCam Pro Windows network patch
        shell: pwsh
        run: |
          Copy-Item "$PWD\\patches\\windows\\server.cpp" "engine\\windows\\src\\net\\server.cpp" -Force
      - name: Brand
        shell: pwsh
        run: |
          $files=Get-ChildItem 'engine\windows\src' -Recurse -File -Include *.cpp,*.h
          foreach($f in $files){
            $s=Get-Content $f.FullName -Raw -Encoding UTF8
            $s=$s.Replace('Nexora Studio','MyCam Pro Studio')
            $s=$s.Replace('NEXORA','MYCAM PRO')
            $s=$s.Replace('Your phone. Your camera. Connected.','Телефон. Ваша камера. Подключено.')
            $s=$s.Replace('No devices detected','Устройства не найдены')
            $s=$s.Replace('OFFLINE  |  Waiting for a device','ОФЛАЙН | Ожидание устройства')
            $s=$s.Replace('Show QR code','Показать QR-код')
            $s=$s.Replace('Connected devices','Подключённые устройства')
            Set-Content $f.FullName $s -Encoding UTF8
          }
      - name: Apply MyCam Pro UI
        shell: pwsh
        run: |
          Copy-Item "$PWD\windows-ui\window.cpp" "engine\windows\src\gui\window.cpp" -Force
      - name: MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: vcpkg
        shell: pwsh
        run: |
          Set-Location engine
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install --triplet x64-windows
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" integrate install
      - name: Build virtual camera
        shell: cmd
        run: |
          msbuild engine\windows\3rdparty\softcam\softcam.sln /m /t:softcam /p:Configuration=Release /p:Platform=x64
          msbuild engine\windows\3rdparty\softcam\examples\softcam_installer\softcam_installer.sln /m /p:Configuration=Release /p:Platform=x64
      - name: Build Studio
        shell: cmd
        run: msbuild engine\windows\Nexora.sln /m /p:Configuration=Release /p:Platform=x64
      - name: Package
        shell: pwsh
        run: |
          $dist="$PWD\dist"
          $staged="$PWD\engine\dist"
          if(!(Test-Path $staged)){throw "engine\dist was not produced"}
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item "$staged\*" $dist -Recurse -Force
          $exe=Get-ChildItem $dist -Filter "Nexora.exe" | Select-Object -First 1
          if(!$exe){throw "Nexora.exe not found in engine\dist"}
          Rename-Item $exe.FullName "$dist\MyCamPro.exe" -Force
          if(!(Test-Path "$dist\avformat-63.dll")){throw "FFmpeg runtime DLLs were not packaged"}
          if(!(Test-Path "$dist\softcam.dll")){throw "softcam.dll not packaged"}
          if(!(Test-Path "$dist\softcam_installer.exe")){throw "softcam installer not packaged"}

          # Bundle Microsoft Visual C++ runtime (x64) so a clean Windows PC does not
          # fail on VCRUNTIME/MSVCP DLLs.
          $vswhere = Get-Command vswhere.exe -ErrorAction SilentlyContinue
          if($vswhere){
            $vs = & $vswhere.Source -latest -products * -property installationPath
          } else {
            $candidates = @(
              "${env:ProgramFiles}\Microsoft Visual Studio\Installer\vswhere.exe",
              "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            )
            $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if($found){ $vs = & $found -latest -products * -property installationPath }
          }
          if($LASTEXITCODE -ne 0 -or !$vs){throw "Visual Studio installation not found (vswhere.exe unavailable)"}
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC" -Recurse -File -Filter "vcruntime140.dll" |
            Where-Object {$_.FullName -match "\\x64\\Microsoft\.VC.*CRT"} |
            Select-Object -First 1
          if(!$crt){throw "MSVC x64 runtime not found"}
          Copy-Item (Join-Path $crt.Directory.FullName "*.dll") $dist -Force

          $required = @(
            "avcodec-63.dll","avformat-63.dll","avutil-61.dll","swresample-7.dll","swscale-10.dll",
            "wxbase333u_vc_x64_custom.dll","wxmsw333u_core_vc_x64_custom.dll",
            "vcruntime140.dll","vcruntime140_1.dll","msvcp140.dll"
          )
          foreach($dll in $required){
            if(!(Test-Path (Join-Path $dist $dll))){throw "Required runtime DLL missing: $dll"}
          }
          @'
          @echo off
          setlocal
          net session >nul 2>&1
          if not "%errorlevel%"=="0" (
            powershell -NoProfile -ExecutionPolicy Bypass -Command "Start-Process -FilePath '%~f0' -Verb RunAs"
            exit /b
          )
          set "ROOT=%~dp0"
          "%ROOT%softcam_installer.exe" register "%ROOT%softcam.dll"
          if errorlevel 1 (
            echo Failed to register MyCam Pro Camera.
            pause
            exit /b 1
          )
          start "" "%ROOT%MyCamPro.exe"
          endlocal
          '@ | Set-Content "$dist\install.bat" -Encoding ASCII
          @'
          @echo off
          setlocal
          net session >nul 2>&1
          if not "%errorlevel%"=="0" (
            powershell -NoProfile -ExecutionPolicy Bypass -Command "Start-Process -FilePath '%~f0' -Verb RunAs"
            exit /b
          )
          "%~dp0softcam_installer.exe" unregister "%~dp0softcam.dll"
          endlocal
          '@ | Set-Content "$dist\uninstall.bat" -Encoding ASCII
          @'
          MyCam Pro
          В OBS выбирайте: Устройство захвата видео -> MyCam Pro Camera.
          Подключение: Wi-Fi 2,4/5 ГГц или USB.
          '@ | Set-Content "$dist\README_RU.txt" -Encoding UTF8
      - name: Verify EXE
        shell: pwsh
        run: |
          if(!(Test-Path "dist\MyCamPro.exe")){throw "MyCamPro.exe not produced"}
          if((Get-Item "dist\MyCamPro.exe").Length -lt 100KB){throw "EXE is unexpectedly small"}
      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: MyCamPro-Windows-x64
          path: dist\**
          if-no-files-found: error

# UI reference build trigger: Russian UTF-8, dark/light, collapsible panels, emergency restore.
